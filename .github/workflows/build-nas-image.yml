name: Build NAS collector image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "collector/**"
      - ".github/workflows/build-nas-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ARM64 collector
        uses: docker/build-push-action@v7
        with:
          context: collector
          file: collector/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/choongsik-yoo/widbid-collector:latest
            ghcr.io/choongsik-yoo/widbid-collector:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Choongsik-Yoo/widbid
            org.opencontainers.image.description=WithBid NAS bid collector
          cache-from: type=gha
          cache-to: type=gha,mode=max
