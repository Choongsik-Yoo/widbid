name: Prepare encrypted NAS configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Create configuration without logging values
        shell: bash
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          G2B_BASE_URL: ${{ vars.G2B_BASE_URL }}
          BIDPAGE_ENABLED: ${{ vars.BIDPAGE_ENABLED }}
          BIDPAGE_BASE_URL: ${{ vars.BIDPAGE_BASE_URL }}
          BIDPAGE_TLS_SHA256: ${{ vars.BIDPAGE_TLS_SHA256 }}
          BIDPAGE_USERNAME: ${{ secrets.BIDPAGE_USERNAME }}
          BIDPAGE_PASSWORD: ${{ secrets.BIDPAGE_PASSWORD }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os

          names = (
              "DATA_GO_KR_API_KEY",
              "SUPABASE_URL",
              "SUPABASE_SERVICE_ROLE_KEY",
              "G2B_BASE_URL",
              "BIDPAGE_ENABLED",
              "BIDPAGE_BASE_URL",
              "BIDPAGE_TLS_SHA256",
              "BIDPAGE_USERNAME",
              "BIDPAGE_PASSWORD",
          )
          optional = {"G2B_BASE_URL"}
          missing = [
              name for name in names
              if name not in optional and not os.environ.get(name)
          ]
          if missing:
              raise SystemExit(f"Missing repository settings: {', '.join(missing)}")
          with open("nas.env", "w", encoding="utf-8", newline="\n") as output:
              for name in names:
                  value = os.environ[name]
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"Multiline values are not supported: {name}")
                  output.write(f"{name}={value}\n")
          PY
          openssl cms -encrypt -binary -aes-256-cbc -outform DER \
            -in nas.env -out nas.env.enc deploy/nas/transfer.crt
          rm -f nas.env
      - name: Upload encrypted configuration
        uses: actions/upload-artifact@v7
        with:
          name: withbid-nas-config
          path: nas.env.enc
          retention-days: 1
