name: Collect G2B bids

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    # Bidpage가 GitHub Ubuntu(Azure) 대역을 403으로 차단하므로
    # 공개 저장소에서 비용 없이 제공되는 별도 macOS 네트워크 경로를 사용합니다.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - name: Install dependencies
        run: pip install -r collector/requirements.txt
      - name: Collect bids
        working-directory: collector
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          G2B_BASE_URL: ${{ vars.G2B_BASE_URL }}
          BIDPAGE_ENABLED: ${{ vars.BIDPAGE_ENABLED }}
          BIDPAGE_BASE_URL: ${{ vars.BIDPAGE_BASE_URL }}
          BIDPAGE_TLS_SHA256: ${{ vars.BIDPAGE_TLS_SHA256 }}
          BIDPAGE_USERNAME: ${{ secrets.BIDPAGE_USERNAME }}
          BIDPAGE_PASSWORD: ${{ secrets.BIDPAGE_PASSWORD }}
        run: python main.py
